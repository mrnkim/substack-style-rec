[project]
name = "substack-rec-backend"
version = "0.1.0"
description = "FastAPI + Pixeltable backend for Substack TV-style video recommendations"
requires-python = ">=3.11"
dependencies = [
    "pixeltable>=0.7.18",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "twelvelabs",
    "httpx",
    "yt-dlp",
    "scenedetect>=0.6.7.1",
    "opencv-python-headless>=4.13.0.92",
]

[[tool.pixeltable.database]]
# Required by `pxt schema update` (Pixeltable >=0.7.5).
# vars.media_dest = 's3://bucket/prefix'
# secrets.openai_api_key = '...'

